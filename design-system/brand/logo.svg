<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-label="Granbury Carpet Cleaning">
  <defs>
    <style>
      .word-primary {
        font-family: "Arial Black", Arial, sans-serif;
        font-weight: 900;
        fill: #d81c1c;
        stroke: #16141a;
        stroke-width: 6;
        paint-order: stroke fill;
      }
      .word-secondary {
        font-family: "Arial Black", Arial, sans-serif;
        font-weight: 900;
        font-style: italic;
        fill: #2266d8;
        stroke: #16141a;
        stroke-width: 5;
        paint-order: stroke fill;
      }
    </style>
  </defs>

  <image href="mascot.svg" x="10" y="0" width="220" height="260" />

  <text class="word-primary" x="250" y="120" font-size="92">GRANBURY</text>
  <text class="word-secondary" x="252" y="190" font-size="64">Carpet Cleaning</text>
</svg>
