<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Granbury Carpet Cleaning icon">
  <defs>
    <style>
      .skin { fill: #f0c39a; }
      .cap { fill: #2b4fc0; }
      .cap-brim { fill: #1e3a94; }
      .shirt { fill: #3f7cf0; }
      .outline { stroke: #16141a; stroke-width: 3; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="200" height="200" rx="40" fill="#141b2e" />

  <!-- shoulders -->
  <path class="shirt outline" d="M50 150 C50 118, 72 100, 100 100 C128 100, 150 118, 150 150 L150 168 L50 168 Z" />

  <!-- neck -->
  <rect class="skin" x="90" y="88" width="20" height="16" />

  <!-- head -->
  <circle class="skin outline" cx="100" cy="72" r="32" />

  <!-- smile -->
  <path d="M86 82 Q100 92 114 81" fill="none" stroke="#8a5a3a" stroke-width="3" stroke-linecap="round" />
  <circle cx="88" cy="68" r="3.4" fill="#16141a" />
  <circle cx="112" cy="68" r="3.4" fill="#16141a" />

  <!-- cap -->
  <path class="cap outline" d="M66 58 C 66 34, 86 20, 101 20 C 118 20, 134 36, 134 58 Z" />
  <ellipse class="cap-brim outline" cx="122" cy="58" rx="26" ry="8" />
</svg>
